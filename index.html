<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="home-container">
    <h1>Multi-Level Quiz App</h1>
    <p>Complete a level with all correct answers to unlock the next level!</p>
    <div class="levels">
        <button class="level-btn" data-level="1">Level 1</button>
        <button class="level-btn" data-level="2" disabled>Level 2</button>
        <button class="level-btn" data-level="3" disabled>Level 3</button>
        <button class="level-btn" data-level="4" disabled>Level 4</button>
    </div>
</div>

<script src="home.js"></script>
</body>
</html>
